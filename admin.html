<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omda Rent Car — Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
  <style>body{background:#141414;color:#e0e0e0;font-family:'Inter',system-ui,sans-serif;}.notif-item.unread{background:rgba(231,37,38,0.06);border-color:rgba(231,37,38,0.15);}.admin-logout{color:var(--alizarin-crimson)!important;margin-top:auto;border-top:1px solid rgba(255,255,255,0.04);padding-top:12px!important;border-radius:0!important;}</style>
</head>
<body>
  <section class="admin-section" id="adminSection" style="display:block;position:relative;height:auto;min-height:100vh;z-index:1;opacity:1;visibility:visible;overflow:visible;">
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <div class="admin-logo">
          <img src="/logo.jpeg" alt="Omda Rent Car" class="admin-logo-img" />
          Omda<span>.</span> Admin
          <a href="/" style="color:var(--nobel);font-size:12px;text-decoration:none;">← Site</a>
        </div>
        <ul class="admin-nav">
          <li><a href="#" data-admin="overview" class="active">📊 Overview</a></li>
          <li><a href="#" data-admin="bookings">📋 Bookings</a></li>
          <li><a href="#" data-admin="cars">🚗 Manage Cars</a></li>
          <li><a href="#" data-admin="history">📜 History</a></li>
          <li><a href="#" id="notifToggle">🔔 Notifications <span id="notifBadge" style="background:var(--alizarin-crimson);color:#fff;padding:2px 8px;border-radius:100px;font-size:11px;">0</span></a></li>
          <li><a href="#" id="logoutBtn" class="admin-logout">🚪 Logout</a></li>
        </ul>
      </aside>
      <main class="admin-content" id="adminContent">
        <div class="admin-header">
          <h1 id="adminPageTitle">Dashboard Overview</h1>
          <span class="admin-date" id="adminDate"></span>
        </div>
        <div id="adminPageContent"></div>
      </main>
    </div>
  </section>

  <div class="notif-panel" id="notifPanel">
    <h3>🔔 Notifications <button class="modal-close" id="notifClose">✕</button></h3>
    <div id="notifList"></div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script type="module" src="/src/admin.js"></script>
</body>
</html>
