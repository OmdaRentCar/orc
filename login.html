<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omda Rent Car — Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e72526'/%3E%3Ctext x='16' y='23' text-anchor='middle' fill='white' font-size='20' font-family='sans-serif' font-weight='bold'%3EV%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --cod-gray: #141414;
      --alizarin-crimson: #e72526;
      --black-haze: #e8eaea;
      --gunsmoke: #848c88;
      --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-primary);
      background: var(--cod-gray);
      color: var(--black-haze);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .login-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    .login-bg::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, rgba(231,37,38,0.03) 60deg, transparent 120deg, rgba(231,37,38,0.03) 180deg, transparent 240deg, rgba(231,37,38,0.03) 300deg, transparent 360deg);
      animation: rotate 30s linear infinite;
    }
    .login-bg::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(231,37,38,0.06) 0%, transparent 60%);
    }
    @keyframes rotate {
      to { transform: rotate(360deg); }
    }
    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 24px;
    }
    .login-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 20px;
      padding: 40px 32px;
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--alizarin-crimson), transparent);
      opacity: 0.6;
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      margin-bottom: 16px;
      object-fit: cover;
    }
    .login-header h1 {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .login-header h1 span { color: var(--alizarin-crimson); }
    .login-header p {
      color: var(--gunsmoke);
      font-size: 14px;
      margin-top: 8px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--gunsmoke);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--black-haze);
      font-size: 15px;
      transition: all 0.3s ease;
    }
    .form-group input:focus {
      border-color: var(--alizarin-crimson);
      box-shadow: 0 0 0 3px rgba(231,37,38,0.15);
      background: rgba(255,255,255,0.06);
    }
    .form-group input::placeholder { color: rgba(132, 140, 136, 0.5); }
    .login-btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      background: var(--alizarin-crimson);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      position: relative;
      overflow: hidden;
    }
    .login-btn:hover {
      background: #d01f20;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(231,37,38,0.3);
    }
    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .login-btn .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }
    .login-btn.loading .spinner { display: block; }
    .login-btn.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .login-error {
      background: rgba(231,37,38,0.1);
      border: 1px solid rgba(231,37,38,0.2);
      color: var(--alizarin-crimson);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      text-align: center;
    }
    .login-error.show { display: block; }
    .login-footer {
      text-align: center;
      margin-top: 24px;
      color: var(--gunsmoke);
      font-size: 13px;
    }
    .login-footer a {
      color: var(--alizarin-crimson);
      text-decoration: none;
      font-weight: 600;
    }
    .login-footer a:hover { text-decoration: underline; }
    .password-wrap {
      position: relative;
    }
    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--gunsmoke);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
    }
    .password-toggle:hover { color: var(--black-haze); }
  </style>
</head>
<body>
  <div class="login-bg"></div>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="/logo.jpeg" alt="Omda Rent Car" class="login-logo" onerror="this.style.display='none'" />
        <h1>Omda<span>.</span> Admin</h1>
        <p>Sign in to manage your fleet</p>
      </div>
      <div class="login-error" id="loginError"></div>
      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" placeholder="Enter your username" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" />
            <button type="button" class="password-toggle" id="passwordToggle" tabindex="-1">👁</button>
          </div>
        </div>
        <button type="submit" class="login-btn" id="loginBtn">
          <span class="spinner"></span>
          <span class="btn-text">Sign In</span>
        </button>
      </form>
      <div class="login-footer">
        <a href="/">← Back to Site</a>
      </div>
    </div>
  </div>
  <script>
    const API = 'http://localhost:4000/api';
    const form = document.getElementById('loginForm');
    const username = document.getElementById('username');
    const password = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const toggleBtn = document.getElementById('passwordToggle');

    toggleBtn.addEventListener('click', () => {
      const type = password.type === 'password' ? 'text' : 'password';
      password.type = type;
      toggleBtn.textContent = type === 'password' ? '👁' : '👁‍🗨';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.classList.remove('show');
      loginBtn.classList.add('loading');
      loginBtn.disabled = true;

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username.value.trim(), password: password.value }),
        });
        const data = await res.json();
        if (!res.ok) {
          loginError.textContent = data.error || 'Login failed';
          loginError.classList.add('show');
          return;
        }
        localStorage.setItem('admin_token', data.token);
        localStorage.setItem('admin_user', JSON.stringify(data.user));
        window.location.href = '/admin.html';
      } catch (err) {
        loginError.textContent = 'Connection error. Is the server running?';
        loginError.classList.add('show');
      } finally {
        loginBtn.classList.remove('loading');
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
